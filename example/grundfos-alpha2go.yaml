# Example: Grundfos ALPHA2 GO over BLE -> ESPHome
substitutions:
  name: grundfos-pump
  pump_mac: "AA:BB:CC:DD:EE:FF"   # pump MAC (name in scan: "ALPHA2 GO")

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    grundfos_alpha2go: DEBUG    # VERBOSE additionally shows every raw field of every reply

api:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components          # folder containing grundfos_alpha2go/

esp32_ble_tracker:

ble_client:
  - mac_address: ${pump_mac}
    id: pump

sensor:
  - platform: grundfos_alpha2go
    id: pump_go
    ble_client_id: pump
    update_interval: 10s
    flow:
      name: "Pump Flow"
    head:
      name: "Pump Head"
    power:
      name: "Pump Power"
    voltage:
      name: "Pump Mains Voltage"
    dc_voltage:
      name: "Pump DC Link Voltage"
    current:
      name: "Pump Current"
    speed:
      name: "Pump Speed"
    aux_temperature:
      name: "Pump Electronics Temperature"
    starts:
      name: "Pump Starts"
    operating_hours:
      name: "Pump Operating Hours"
    power_on_hours:
      name: "Pump Power-On Hours"
    media_temperature:
      name: "Pump Media Temperature"
    pcb_temperature:
      name: "Pump PCB Temperature"
    controlbox_temperature:
      name: "Pump Control Box Temperature"
    energy:                     # pump's own counter (as "Accumulated power consumption" in the app)
      name: "Pump Energy"
    # Operation / control mode as text (numeric codes: operation_mode / control_mode, see README)
    operation_mode_text:
      name: "Pump Operation Mode"
    control_mode_text:
      name: "Pump Control Mode"
    # Setpoint: in m, m3/h or rpm depending on control mode; the others are then "unknown"
    setpoint_head:
      name: "Pump Setpoint Head"
    setpoint_flow:
      name: "Pump Setpoint Flow"
    setpoint_speed:
      name: "Pump Setpoint Speed"
    setpoint_actual:
      name: "Pump Current Target"
    # Settings and status
    night_setback_enabled:
      name: "Pump Night Setback Enabled"
    night_mode:
      name: "Pump Night Mode"
    air_detection_enabled:
      name: "Pump Air Detection Enabled"
    air_detections:
      name: "Pump Air Detections"
    venting_active:
      name: "Pump Venting Active"
    venting_status:
      name: "Pump Venting Status"
    connected:
      name: "Pump Connected"

# Controls (write to the pump; state is always read back)
switch:
  - platform: grundfos_alpha2go
    pump:
      name: "Pump"
    night_setback:
      name: "Pump Night Setback"
    air_detection:
      name: "Pump Air Detection"

select:
  - platform: grundfos_alpha2go
    control_mode:
      name: "Pump Control Mode"

number:
  - platform: grundfos_alpha2go
    setpoint_head:              # proportional / constant pressure only
      name: "Pump Setpoint Head"
      mode: box
    setpoint_flow:              # constant flow only
      name: "Pump Setpoint Flow"
    setpoint_speed:             # constant speed only
      name: "Pump Setpoint Speed"

button:
  - platform: grundfos_alpha2go
    venting_start:
      name: "Pump Start System Venting"
    venting_stop:
      name: "Pump Stop System Venting"
